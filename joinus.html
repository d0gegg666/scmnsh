<script>
function esc(s){if(!s&&s!==0)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}function escJs(s){return String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function setText(id,v){var el=document.getElementById(id);if(el&&v!=null&&v!==undefined)el.textContent=v;}
(function u(){var d=new Date();var days=['日','一','二','三','四','五','六'];var el=document.getElementById('topDate');if(el)el.value=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+days[d.getDay()];setTimeout(u,60000);})();

function renderJoin(){
var d=window.__CMS_DATA__;if(!d)return;var f=d.footer;if(f){if(f.headerLogo){var hli=document.getElementById("headerLogoImg");if(hli)hli.src=f.headerLogo;}if(f.logo){var fli=document.getElementById("footerLogo");if(fli)fli.src=f.logo;}}
var c=document.getElementById('joinContent');if(!c)return;
var page=(location.search||'').match(/page=(\w+)/);
page=page?page[1]:'guide';
document.querySelectorAll('.tab-nav a').forEach(function(a){a.classList.toggle('active',a.dataset.p===page);});
var j=d.joinus||{};
if(page==='guide'){
c.innerHTML='<div class="guide-layout"><div class="guide-left"><div class="card"><h3>入会条件</h3><div style="font-size:14px;line-height:2;color:#555;white-space:pre-line">'+esc(j.req||'入会条件待补充')+'</div></div><div class="card"><h3>入会流程</h3><div style="font-size:14px;line-height:2;color:#555;white-space:pre-line">'+esc(j.process||'入会流程待补充')+'</div></div></div><div class="guide-right"><div class="join-contact"><h3>联系我们</h3><div class="contact-item"><i class="fa fa-phone"></i><span class="label">联系电话：</span><span class="phone">028-83392693</span></div><div class="contact-item"><i class="fa fa-envelope"></i><span class="label">电子邮箱：</span><span>smcc0924@163.com</span></div><div class="contact-item"><i class="fa fa-map-marker"></i><span class="label">联系地址：</span><span>成都市金牛区育仁西路8号茗园尚筑2栋29楼</span></div></div></div></div>';
}else if(page==='apply'){
c.innerHTML='<div class="card"><h3>在线入会申请</h3><form id="joinForm" onsubmit="submitJoin(event)" style="max-width:700px;margin:0 auto"><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px"><div><label style="font-size:13px;color:#666;display:block;margin-bottom:4px">企业名称 <span style="color:red">*</span></label><input type="text" name="company" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px"></div><div><label style="font-size:13px;color:#666;display:block;margin-bottom:4px">联系人 <span style="color:red">*</span></label><input type="text" name="contact" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px"></div><div><label style="font-size:13px;color:#666;display:block;margin-bottom:4px">联系电话 <span style="color:red">*</span></label><input type="tel" name="phone" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px"></div><div><label style="font-size:13px;color:#666;display:block;margin-bottom:4px">电子邮箱</label><input type="email" name="email" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px"></div></div><div style="margin-top:15px"><label style="font-size:13px;color:#666;display:block;margin-bottom:4px">企业地址</label><input type="text" name="address" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px"></div><div style="margin-top:15px"><label style="font-size:13px;color:#666;display:block;margin-bottom:4px">主营业务</label><input type="text" name="business" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px"></div><div style="margin-top:15px"><label style="font-size:13px;color:#666;display:block;margin-bottom:4px">申请说明</label><textarea name="remark" rows="4" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px;resize:vertical"></textarea></div><div style="margin-top:20px;text-align:center"><button type="submit" style="padding:12px 50px;background:#CC0000;color:#fff;border:none;border-radius:25px;font-size:16px;cursor:pointer;transition:all 0.3s">提交申请</button></div><div id="joinMsg" style="text-align:center;margin-top:10px;font-size:14px"></div></form></div>';
}
var f=d.footer;if(f){setText('ft-addr',f.addr);setText('ft-phone',f.phone);setText('ft-email',f.email);setText('ft-icp',f.icp);if(f.copyright){var cx=document.getElementById('copyright');if(cx)cx.textContent=f.copyright;}if(f.qrcode){var fq=document.getElementById('footerQr');if(fq)fq.src=f.qrcode;}}
}
function submitJoin(e){e.preventDefault();var f=e.target;var data={};for(var i=0;i<f.elements.length;i++){var el=f.elements[i];if(el.name)data[el.name]=el.value;}data.time=new Date().toISOString();data.id=Date.now();var apps=JSON.parse(localStorage.getItem('scmn_applications')||'[]');apps.push(data);try{localStorage.setItem('scmn_applications',JSON.stringify(apps));}catch(e){document.getElementById('joinMsg').innerHTML='<span style="color:#f00">存储空间不足，请联系管理员。</span>';return;}document.getElementById('joinMsg').innerHTML='<span style="color:#4CAF50"><i class="fa fa-check-circle"></i> 申请已提交成功！我们会尽快与您联系。</span>';f.reset();setTimeout(function(){document.getElementById('joinMsg').innerHTML='';},5000);}
document.querySelectorAll('.tab-nav a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var p=this.dataset.p;history.replaceState(null,'','?page='+p);document.querySelectorAll('.tab-nav a').forEach(function(x){x.classList.remove('active');});this.classList.add('active');renderJoin();});});
(function(){if(window.__CMS_DATA__){renderJoin();return;}function _ld(u){var s=document.createElement('script');s.src=u;s.onload=function(){if(window.__CMS_DATA__)renderJoin();};s.onerror=function(){var el=document.getElementById('joinContent');if(el)el.innerHTML='<div class="empty-tip"><i class="fa fa-exclamation-triangle"></i><p>数据加载失败，请刷新页面重试</p></div>';renderJoin();};document.body.appendChild(s);}fetch('version.txt?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('v');return r.text();}).then(function(v){_ld('data.js?v='+v.trim());}).catch(function(){_ld('data.js');});})();
</script>
