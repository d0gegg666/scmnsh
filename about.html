<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商会概况 - 四川省闽南商会</title>
<meta name="keywords" content="四川省闽南商会,商会简介,领导班子,荣誉历程">
<meta name="description" content="四川省闽南商会概况">
<link rel="icon" type="image/png" href="favicon.png">

<script>tailwind.config={theme:{extend:{colors:{primary:'#CC0000',gold:'#C9A84C'}}}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","微软雅黑",Arial,sans-serif;background:#f5f5f5;color:#333;min-width:1200px}
a{text-decoration:none;color:inherit}ul,ol{list-style:none}
.topbar{width:100%;height:40px;line-height:40px;background:#f9f9f9;border-bottom:1px solid #eee;font-size:12px;color:#999}
.topbar-inner{width:1200px;margin:0 auto}
.topbar-welcome span{font-weight:bold;color:#999}
.header{width:100%;height:130px;background:linear-gradient(135deg,#5C3D0E,#8B6914,#C9A84C)}
.header-inner{width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:130px}
.header-logo{display:flex;align-items:center;gap:20px}
.header-logo img{height:80px;width:auto}
.header-slogan{color:#3D1C00;font-size:16px;letter-spacing:2px}
.navbar{width:100%;height:52px;background:#CC0000;position:sticky;top:0;z-index:999}
.navbar-inner{width:1200px;margin:0 auto;display:flex;align-items:center;height:52px}
.navbar-menu{display:flex;height:52px}
.navbar-menu>li{position:relative;height:52px}
.navbar-menu>li>a{display:flex;align-items:center;height:52px;padding:0 18px;color:#fff;font-size:15px;white-space:nowrap;transition:all 0.2s}
.navbar-menu>li:hover>a,.navbar-menu>li>a.active{background:#fff;color:#CC0000}
.navbar-menu>li>a b{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #fff;margin-left:5px;transition:transform 0.3s}
.navbar-menu>li:hover>a b{border-top-color:#CC0000;transform:rotate(180deg)}
.submenu{display:none;position:absolute;top:52px;left:0;background:#CC0000;min-width:140px;z-index:99;padding:5px 0}
.navbar-menu>li:hover>.submenu{display:block}
.submenu li a{display:block;padding:8px 20px;color:#fff;font-size:13px;text-align:center}
.submenu li a:hover{background:#fff;color:#CC0000}
.main{width:1200px;margin:30px auto}
.sec-title{font-size:22px;color:#333;padding:10px 0 10px 15px;border-left:4px solid #CC0000;margin-bottom:20px}
.card{background:#fff;padding:30px;margin-bottom:20px;border-radius:4px}
.card p{font-size:14px;color:#555;line-height:2;text-indent:2em}
.leader-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.leader-card{background:#fff;text-align:center;padding:20px;transition:all 0.3s;border-radius:4px}
.leader-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
.leader-card img{width:150px;height:180px;object-fit:cover;border-radius:4px;background:#f0ebe3;margin-bottom:10px}
.leader-card .name{font-size:15px;font-weight:700}
.leader-card .title{font-size:12px;color:#CC0000;margin-top:4px}
.leader-card .desc{font-size:12px;color:#999;margin-top:4px}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:8px;top:0;width:2px;height:100%;background:linear-gradient(180deg,#CC0000,#C9A84C)}
.timeline-item{position:relative;margin-bottom:20px;padding-left:20px}
.timeline-item::before{content:'';position:absolute;left:-26px;top:4px;width:12px;height:12px;border-radius:50%;background:#CC0000;border:2px solid #C9A84C}
.timeline-item .year{font-size:13px;color:#C9A84C;font-weight:600}
.timeline-item h4{font-size:15px;color:#333;margin:4px 0}
.timeline-item p{font-size:13px;color:#888}
.honor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.honor-card{background:#fff;padding:20px;display:flex;align-items:center;gap:14px;transition:all 0.3s;border-radius:4px}
.honor-card:hover{border-color:#C9A84C;box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.honor-card .icon{font-size:28px;color:#C9A84C}
.honor-card h4{font-size:15px;color:#333;margin-bottom:2px}
.honor-card .year{font-size:12px;color:#CC0000}
.empty-tip{text-align:center;padding:60px;color:#888}
.empty-tip i{font-size:48px;display:block;margin-bottom:12px}
.tab-nav{display:flex;gap:0;margin-bottom:20px;background:#fff;border-radius:4px;overflow:hidden}
.tab-nav a{display:block;padding:12px 28px;font-size:14px;color:#555;transition:all 0.3s}
.tab-nav a.active,.tab-nav a:hover{background:#CC0000;color:#fff}
.footer{background:#800000;color:#ddd;padding:30px 0}
.footer-inner{width:1200px;margin:0 auto;display:flex;align-items:center;gap:40px}
.footer-logo{text-align:center;flex-shrink:0}
.footer-logo img{height:90px}
.footer-links{flex:1}
.footer-links .fl-row{display:flex;margin-bottom:12px;font-size:13px}
.footer-links .fl-row a{color:#ccc;padding:0 12px;border-right:1px solid #444}
.footer-links .fl-row a:first-child{padding-left:0}
.footer-links .fl-row a:last-child{border-right:0}
.footer-links .fl-row a:hover{color:#CC0000}
.footer-links .copyright{font-size:12px;color:#777;line-height:2}
.footer-links .copyright a{color:#aaa}
.footer-qr{text-align:center;flex-shrink:0}
.footer-qr img{width:90px;height:90px;margin-bottom:6px}
.footer-qr p{font-size:12px}
#imgLightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;cursor:pointer;align-items:center;justify-content:center}
#imgLightbox>span{position:absolute;top:20px;right:30px;color:#fff;font-size:36px;cursor:pointer}
#imgLightbox img{max-width:90%;max-height:90%;object-fit:contain}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner"><div class="topbar-welcome">欢迎访问 <span><a href="index.html" style="color:#999">四川省闽南商会官方网站</a></span> 今天是<input type="text" id="topDate" readonly style="border:0;background:none;color:#999;font-size:12px;width:160px"></div></div></div>
<div class="header"><div class="header-inner"><div class="header-logo"><a href="index.html"><img src="logo-header.png" alt="四川省闽南商会" id="headerLogoImg"></a></div><div class="header-slogan">凝聚闽商力量<span style="color:#C9A84C;font-size:22px;"> · </span>服务川闽发展</div></div></div>
<div class="navbar"><div class="navbar-inner"><ul class="navbar-menu">
<li><a href="index.html">网站首页</a></li>
<li><a href="about.html" class="active">商会概况<b></b></a><ul class="submenu"><li><a href="about.html">商会简介</a></li><li><a href="about.html?page=honors">荣誉历程</a></li><li><a href="about.html?page=president">会长寄语</a></li><li><a href="about.html?page=leadership">领导班子</a></li><li><a href="about.html?page=milestones">大事记</a></li></ul></li>
<li><a href="news.html">商会动态</a></li>
<li><a href="party.html">商会党建<b></b></a><ul class="submenu"><li><a href="party.html?p=intro">组织介绍</a></li><li><a href="party.html?p=structure">组织架构</a></li><li><a href="party.html?p=history">发展历程</a></li><li><a href="party.html?p=news">党建新闻</a></li></ul></li>
<li><a href="joinus.html">加入我们</a></li>
</ul></div></div>

<div class="main">
<div class="tab-nav">
<a href="#" class="active" data-p="intro">商会简介</a>
<a href="#" data-p="honors">荣誉历程</a>
<a href="#" data-p="president">会长寄语</a>
<a href="#" data-p="leadership">领导班子</a>
<a href="#" data-p="milestones">大事记</a>
</div>
<div id="aboutContent" style="min-height:400px"></div>
</div>

<div class="footer"><div class="footer-inner">
<div class="footer-logo"><a href="index.html"><img src="logo-footer.png" alt="四川省闽南商会" id="footerLogo"></a></div>
<div class="footer-links"><div class="fl-row"><a href="about.html">商会概况</a><a href="news.html">商会动态</a><a href="party.html">商会党建</a><a href="joinus.html">加入我们</a></div>
<div class="copyright"><p id="copyright">Copyright &copy; 四川省闽南商会 All Rights Reserved</p><p>地址：<span id="ft-addr"></span> | 电话：<span id="ft-phone"></span> | 邮箱：<span id="ft-email"></span></p><p><a href="https://beian.miit.gov.cn/" target="_blank" id="ft-icp"></a></p></div></div>
<div class="footer-qr"><img src="logo-footer.png" alt="官方微信"><p>官方微信</p></div><div class="footer-qr"><img src="logo-footer.png" alt="手机网站"><p>手机网站</p></div>
</div></div>
<div id="imgLightbox" onclick="closeImgLightbox()"><span>&times;</span><img id="imgLightboxImg"></div>

<script>
function esc(s){if(!s&&s!==0)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}function escJs(s){return String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function setText(id,v){var el=document.getElementById(id);if(el&&v!=null&&v!==undefined)el.textContent=v;}
function setAttr(id,a,v){var el=document.getElementById(id);if(el&&v!=null&&v!==undefined)el.setAttribute(a,v);}
function viewNewsImg(t,s){var i=document.getElementById("imgLightboxImg");var l=document.getElementById("imgLightbox");if(i&&l){i.src=s;l.style.display="flex";document.body.style.overflow="hidden";}}
function closeImgLightbox(){var l=document.getElementById("imgLightbox");if(l){l.style.display="none";}document.body.style.overflow="";}
(function u(){var d=new Date();var days=['日','一','二','三','四','五','六'];var el=document.getElementById('topDate');if(el)el.value=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+days[d.getDay()];setTimeout(u,60000);})();

function renderAbout(){
var d=window.__CMS_DATA__;if(!d)return;var f=d.footer;if(f){if(f.headerLogo){var hli=document.getElementById("headerLogoImg");if(hli)hli.src=f.headerLogo;}if(f.logo){var fli=document.getElementById("footerLogo");if(fli)fli.src=f.logo;}}
var c=document.getElementById('aboutContent');
var page=(location.search||'').match(/page=(\w+)/);
page=page?page[1]:'intro';
// 更新tab激活状态
document.querySelectorAll('.tab-nav a').forEach(function(a){a.classList.toggle('active',a.dataset.p===page);});

var a=d.about||{};
if(page==='intro'){
var img=a.img||'logo-footer.png';
c.innerHTML='<div class="card"><div style="display:flex;gap:30px;flex-wrap:wrap"><div style="width:300px;flex-shrink:0"><img src="'+esc(img)+'" style="width:100%;height:250px;object-fit:cover;border-radius:4px"></div><div style="flex:1;min-width:400px"><p style="margin-bottom:15px;font-size:14px;color:#555;line-height:2;text-indent:2em">'+esc(a.p1||'商会简介内容待添加')+'</p><p style="font-size:14px;color:#555;line-height:2;text-indent:2em">'+esc(a.p2||'')+'</p></div></div></div>';
}else if(page==='honors'){
if(d.honors&&d.honors.length>0){c.innerHTML='<div class="honor-grid">'+d.honors.map(function(h){return'<div class="honor-card"><div class="icon"><i class="fa fa-trophy"></i></div><div><h4>'+esc(h.title||'')+'</h4><div class="year">'+esc(h.year||'')+'</div><div style="font-size:12px;color:#888;margin-top:4px">'+esc(h.desc||'')+'</div></div></div>';}).join('')+'</div>';}else{c.innerHTML='<div class="empty-tip"><i class="fa fa-trophy"></i><p>荣誉历程内容待添加</p></div>';}
}else if(page==='president'){
var pd=d.president||{};
c.innerHTML='<div class="card" style="display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap"><div style="width:200px;text-align:center;flex-shrink:0"><img src="'+(pd.img||'logo-header.png')+'" style="width:180px;height:220px;object-fit:cover;border-radius:4px;background:#f0ebe3"><div style="font-size:16px;font-weight:700;margin-top:8px">'+esc(pd.name||'会长')+'</div><div style="font-size:13px;color:#CC0000">'+esc(pd.title||'')+'</div></div><div style="flex:1;min-width:400px"><p style="font-size:14px;color:#555;line-height:2;white-space:pre-line">'+esc(pd.content||'会长寄语内容待添加')+'</p></div></div>';
}else if(page==='leadership'){
if(d.leadership&&d.leadership.length>0){c.innerHTML='<div class="leader-grid">'+d.leadership.sort(function(a,b){return(a.sort||0)-(b.sort||0);}).map(function(m){return'<div class="leader-card">'+(m.img?'<img src="'+esc(m.img)+'" alt="'+esc(m.name||'')+'">':'<div style="width:150px;height:180px;background:#f0ebe3;margin:0 auto 10px;border-radius:4px"></div>')+'<div class="name">'+esc(m.name||'')+'</div><div class="title">'+esc(m.title||'')+'</div>'+(m.desc?'<div class="desc">'+esc(m.desc||'')+'</div>':'')+'</div>';}).join('')+'</div>';}else{c.innerHTML='<div class="empty-tip"><i class="fa fa-users"></i><p>领导班子信息待添加</p></div>';}
}else if(page==='milestones'){
if(d.milestones&&d.milestones.length>0){c.innerHTML='<div class="timeline">'+d.milestones.sort(function(a,b){return parseInt(b.year)-parseInt(a.year)||0;}).map(function(m){return'<div class="timeline-item"><div class="year">'+esc(m.year||'')+(m.month?'-'+esc(m.month||''):'')+'</div><h4>'+esc(m.title||'')+'</h4><p>'+esc(m.desc||'')+'</p></div>';}).join('')+'</div>';}else{c.innerHTML='<div class="empty-tip"><i class="fa fa-history"></i><p>大事记内容待添加</p></div>';}
}
var f=d.footer;if(f){setText('ft-addr',f.addr);setText('ft-phone',f.phone);setText('ft-email',f.email);setText('ft-icp',f.icp);if(f.copyright){var cx=document.getElementById('copyright');if(cx)cx.textContent=f.copyright;}}
}
// Tab 无刷新切换
document.querySelectorAll('.tab-nav a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var p=this.dataset.p;history.replaceState(null,'','?page='+p);document.querySelectorAll('.tab-nav a').forEach(function(x){x.classList.remove('active');});this.classList.add('active');renderAbout();});});
(function(){if(window.__CMS_DATA__){renderAbout();return;}var s=document.createElement('script');s.src='data.js';s.onload=function(){if(window.__CMS_DATA__)renderAbout();};s.onerror=function(){document.getElementById('aboutContent').innerHTML='<div class="empty-tip"><i class="fa fa-exclamation-triangle"></i><p>数据加载失败，请刷新页面重试</p></div>';renderAbout();};document.body.appendChild(s);})();
</script>
</body>
</html>
