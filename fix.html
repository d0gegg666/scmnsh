<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>数据修复</title></head><body>
<h2>数据修复页面</h2>
<p id="msg">正在加载 data.js...</p>
<script>
(async function(){
  var msg=document.getElementById('msg');
  try{
    // 1. 删除旧 IndexedDB
    var req=indexedDB.deleteDatabase('scmnsh_cms');
    await new Promise(function(r){req.onsuccess=r;req.onerror=r;});
    msg.textContent='旧缓存已删除';

    // 2. 删除 localStorage
    localStorage.removeItem('scmn_cms_data_v2');
    localStorage.removeItem('scmn_cms_data_v2_backup');
    msg.textContent='localStorage 已清理';

    // 3. 从 data.js 加载
    var resp=await fetch('data.js');
    var text=await resp.text();
    var m=text.match(/window\.__CMS_DATA__\s*=\s*(\{[\s\S]*\})/);
    if(!m){msg.textContent='解析 data.js 失败';return;}
    var data=JSON.parse(m[1]);

    // 4. 存入 IndexedDB
    var dbReq=indexedDB.open('scmnsh_cms',1);
    dbReq.onupgradeneeded=function(e){e.target.result.createObjectStore('data');};
    await new Promise(function(resolve,reject){
      dbReq.onsuccess=function(e){
        var db=e.target.result;
        var tx=db.transaction('data','readwrite');
        tx.objectStore('data').put(data,'cms_data');
        tx.oncomplete=function(){resolve();};
        tx.onerror=function(){reject(tx.error);};
      };
      dbReq.onerror=function(){reject(dbReq.error);};
    });

    msg.innerHTML='✅ 修复完成！<br>Banner: '+data.banner.length+' 条<br>新闻: '+data.news.length+' 条<br>领导班子: '+data.leadership.length+' 条<br><br><a href="admin.html">→ 返回后台</a>';
  }catch(e){
    msg.textContent='错误: '+e.message;
  }
})();
</script>
</body></html>
