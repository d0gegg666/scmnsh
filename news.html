<style>

body{font-family:"Microsoft YaHei","微软雅黑",Arial,sans-serif;background:#f5f5f5;color:#333;min-width:1200px}
a{text-decoration:none;color:inherit}ul,ol{list-style:none}

.navbar-menu>li{position:relative;height:52px}
.navbar-menu>li>a{display:flex;align-items:center;height:52px;padding:0 18px;color:#fff;font-size:15px;white-space:nowrap;transition:all 0.2s}
.navbar-menu>li:hover>a,.navbar-menu>li>a.active{background:#fff;color:#CC0000}
.navbar-menu>li>a b{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #fff;margin-left:5px;transition:transform 0.3s}
.navbar-menu>li:hover>a b{border-top-color:#CC0000;transform:rotate(180deg)}
.submenu{display:none;position:absolute;top:52px;left:0;background:#CC0000;min-width:140px;z-index:99;padding:5px 0}
.navbar-menu>li:hover>.submenu{display:block}
.submenu li a{display:block;padding:8px 20px;color:#fff;font-size:13px;text-align:center}
.submenu li a:hover{background:#fff;color:#CC0000}
.main{width:1200px;margin:30px auto}
.sec-title{font-size:22px;color:#333;padding:10px 0 10px 15px;border-left:4px solid #CC0000;margin-bottom:20px}
.news-list-item{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px dashed #e8e8e8;cursor:pointer;transition:all 0.3s}
.news-list-item:hover{padding-left:8px;border-bottom-color:#C9A84C}
.news-list-item .date{flex:0 0 100px;font-size:12px;color:#999}
.news-list-item .thumb{flex:0 0 120px;height:80px;object-fit:cover;border-radius:4px;background:#f0ebe3}
.news-list-item .title{flex:1;font-size:15px;color:#333;font-weight:500}
.news-list-item:hover .title{color:#CC0000}
.empty-tip{text-align:center;padding:60px;color:#888}
.empty-tip i{font-size:48px;display:block;margin-bottom:12px}
.footer{background:#800000;color:#ddd;padding:30px 0}
.footer-inner{width:1200px;margin:0 auto;display:flex;align-items:center;gap:40px}
.footer-logo{text-align:center;flex-shrink:0}.footer-logo img{height:90px}
.footer-links{flex:1}
.footer-links .fl-row{display:flex;margin-bottom:12px;font-size:13px}
.footer-links .fl-row a{color:#ccc;padding:0 12px;border-right:1px solid #444}
.footer-links .fl-row a:first-child{padding-left:0}
.footer-links .fl-row a:last-child{border-right:0}
.footer-links .fl-row a:hover{color:#CC0000}
.footer-links .copyright{font-size:12px;color:#777;line-height:2}
.footer-links .copyright a{color:#aaa}
.footer-qr{text-align:center;flex-shrink:0}.footer-qr img{width:90px;height:90px;margin-bottom:6px}.footer-qr p{font-size:12px}
#imgLightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;cursor:pointer;align-items:center;justify-content:center}
#imgLightbox>span{position:absolute;top:20px;right:30px;color:#fff;font-size:36px;cursor:pointer}
#imgLightbox img{max-width:90%;max-height:90%;object-fit:contain}

<div class="footer-qr"><img src="logo-footer.png" alt="官方微信"><p>官方微信</p></div><div class="footer-qr"><img src="logo-footer.png" alt="手机网站"><p>手机网站</p></div>
</div></div>

<script>
function esc(s){if(!s&&s!==0)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}function escJs(s){return String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function setText(id,v){var el=document.getElementById(id);if(el&&v!=null&&v!==undefined)el.textContent=v;}
function viewNewsImg(t,s){var i=document.getElementById("imgLightboxImg");var l=document.getElementById("imgLightbox");if(i&&l){i.src=s;l.style.display="flex";document.body.style.overflow="hidden";}}
function closeImgLightbox(){var l=document.getElementById("imgLightbox");if(l){l.style.display="none";}document.body.style.overflow="";}
(function u(){var d=new Date();var days=['日','一','二','三','四','五','六'];var el=document.getElementById('topDate');if(el)el.value=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+days[d.getDay()];setTimeout(u,60000);})();

function renderNews(){
var d=window.__CMS_DATA__;if(!d)return;var f=d.footer;if(f){if(f.headerLogo){var hli=document.getElementById("headerLogoImg");if(hli)hli.src=f.headerLogo;}if(f.logo){var fli=document.getElementById("footerLogo");if(fli)fli.src=f.logo;}}
var all=(d.news||[]).concat(d.biznews||[]);
var toNum=function(dt){if(!dt)return 0;var s=dt.replace(/[年月]/g,'-').replace(/[日]/g,'');var p=s.split('-');return parseInt(p[0])*10000+parseInt(p[1])*100+parseInt(p[2]);};all.sort(function(a,b){return toNum(b.date)-toNum(a.date);});
var el=document.getElementById('newsList');if(!el)return;
if(all.length===0){el.innerHTML='<div class="empty-tip"><i class="fa fa-newspaper-o"></i><p>暂无内容</p></div>';return;}
el.innerHTML=all.map(function(n){
var link=n.link||'#';var isValid=link&&link!=='#'&&!link.startsWith('data:');var hasImg=n.img&&n.img.startsWith('data:');
if(isValid)return'<a href="'+esc(link)+'" class="news-list-item"><span class="date">'+esc(n.date||'')+'</span>'+(n.img?'<img src="'+esc(n.img)+'" class="thumb" alt="">':'')+'<span class="title">'+esc(n.title||'')+'</span></a>';
if(hasImg)return'<a href="javascript:void(0)" class="news-list-item" onclick="viewNewsImg(\''+escJs(n.title||'')+'\',\''+escJs(n.img)+'\')"><span class="date">'+esc(n.date||'')+'</span><img src="'+esc(n.img)+'" class="thumb" alt=""><span class="title">'+esc(n.title||'')+'</span></a>';
return'<span class="news-list-item" style="cursor:default"><span class="date">'+esc(n.date||'')+'</span>'+(n.img?'<img src="'+esc(n.img)+'" class="thumb" alt="">':'')+'<span class="title">'+esc(n.title||'')+'</span></span>';
}).join('');
var f=d.footer;if(f){setText('ft-addr',f.addr);setText('ft-phone',f.phone);setText('ft-email',f.email);setText('ft-icp',f.icp);if(f.copyright){var cx=document.getElementById('copyright');if(cx)cx.textContent=f.copyright;}}
}
(function(){if(window.__CMS_DATA__){renderNews();return;}function _ld(u){var s=document.createElement('script');s.src=u;s.onload=function(){if(window.__CMS_DATA__)renderNews();};s.onerror=function(){var el=document.getElementById("newsList");if(el)el.innerHTML='<div class="empty-tip"><i class="fa fa-exclamation-triangle"></i><p>数据加载失败，请刷新页面重试</p></div>';renderNews();};document.body.appendChild(s);}fetch('version.txt?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('v');return r.text();}).then(function(v){_ld('data.js?v='+v.trim());}).catch(function(){_ld('data.js');});})();
</script>
